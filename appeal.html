<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://i.ytimg.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src https://www.youtube-nocookie.com; form-action 'self'; base-uri 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Appeal — Badr Grappling</title>
<meta name="description" content="Donate to a Badr Grappling appeal.">
<link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32">
<link rel="icon" href="assets/brand/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="assets/brand/favicon-180.png">
<link rel="stylesheet" href="css/styles.css">
<style>
  .appeal-hero { aspect-ratio: 16 / 9; background: var(--bone-deep); overflow: hidden; }
  .appeal-hero img { width: 100%; height: 100%; object-fit: cover; }
  .amounts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .5rem; }
  .amounts .chip { min-height: var(--tap); font-size: 1rem; font-weight: 600; }
  .freq { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-bottom: 1.25rem; }
  .freq .chip { min-height: var(--tap); }
  .money-in { position: relative; }
  .money-in span { position: absolute; left: .8rem; top: 50%; transform: translateY(-50%); color: var(--ink-mute); }
  .money-in input { padding-left: 1.7rem; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="masthead"></div>

<main id="main">
  <section class="band band-tight">
    <div class="wrap">
      <p class="eyebrow"><a class="link" href="donate.html" style="border:0">Fundraise</a></p>
      <h1 class="h1" id="a-title">Appeal</h1>
    </div>
  </section>

  <section class="band-tight band-line">
    <div class="wrap">
      <div class="notice" id="a-msg" hidden></div>
      <div class="grid g2" style="align-items:start" id="a-body">
        <p class="load">Loading appeal…</p>
      </div>
    </div>
  </section>
</main>

<footer id="foot"></footer>
<script type="module" src="js/chrome.js"></script>
<script type="module" src="js/donate.js"></script>
</body>
</html>
